# Opens the pull request that moves github.com/runpod/go-sdk/v2 in v2/go.mod to a
# new SDK release. runpod/go-sdk's release workflow sends the dispatch once it has
# tagged; Run workflow does the same for a version typed by hand.
#
# Only the bump is made here. Whether it compiles is answered by test.yml, which
# is also where a breaking SDK change becomes visible. The pull request is never
# merged automatically.
#
# It is opened with GITHUB_TOKEN, so no pull_request event is raised for it and
# test.yml does not start by itself. The last steps ask for that run against the
# branch and say so in Slack, since its checks then live in the Actions tab
# rather than on the pull request.
name: SDK bump

on:
  repository_dispatch:
    types: [go-sdk-release]
  workflow_dispatch:
    inputs:
      version:
        description: "go-sdk release to bump to, e.g. v2.2.0 (empty takes the newest from the module proxy)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  # Starting test.yml on the branch: a pull request opened with GITHUB_TOKEN
  # raises no events, so its checks have to be asked for.
  actions: write

concurrency:
  group: sdk-bump
  cancel-in-progress: false

env:
  MODULE: github.com/runpod/go-sdk/v2
  BRANCH: automation/go-sdk-bump
  # Both comma separated, so they grow into lists without touching the steps.
  REVIEWERS: rsavrp
  # Slack member ids, not display names: only <@Uxxxxxxxx> notifies anyone.
  SLACK_REVIEWERS: "<@U0CE8KNH0JZ>"

jobs:
  bump:
    name: Bump
    # Not ubuntu-latest: the organization's IP allow list refuses GitHub API calls
    # from the shared runners, and this job is one API call from end to end.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # Pinned to main: on a pull_request event the default checkout is the merge
      # commit, and the bump would branch off that and carry its diff along.
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: 'v2/go.mod'
          cache: true
          cache-dependency-path: 'v2/go.sum'

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$PAYLOAD_TAG}"
          if [ -z "$version" ]; then
            version=$(curl -fsS "https://proxy.golang.org/${MODULE}/@latest" | jq -r '.Version')
          fi
          # The module path carries the major, so only v2 can be pinned here. A
          # branch name typed into the form lands on a pseudo-version otherwise.
          # Releases only: sort -V orders v2.3.0-rc.1 after v2.3.0, so a pinned
          # pre-release would read its own final release as a downgrade.
          if [[ ! "$version" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is not a v2 release of ${MODULE}"
            exit 1
          fi
          # A version the proxy does not serve yet would leave go.mod pointing at
          # nothing; failing here beats a pull request nobody can build.
          curl -fsS "https://proxy.golang.org/${MODULE}/@v/${version}.info" > /dev/null

          current=$(cd v2 && go mod edit -json | jq -r --arg m "$MODULE" \
            '.Require[] | select(.Path == $m) | .Version')
          # sort -V puts the newer last. Equal is fine, the bump step says so and
          # stops; older is a downgrade nobody asked for.
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)
          if [ "$version" != "$current" ] && [ "$newest" != "$version" ]; then
            echo "::error::$version is older than the pinned $current"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumping ${MODULE} from ${current} to ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump the dependency
        id: bump
        working-directory: v2
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go get "${MODULE}@${VERSION}"
          go mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo "::notice::go.mod already points at ${VERSION}, nothing to open"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # create-pull-request force-pushes the branch when it updates it, so a fix
      # someone pushed onto an open bump would vanish on the next release. If the
      # branch carries a commit this workflow did not write, it is theirs now.
      # Only while the bump is open: closing one leaves its branch behind, and
      # the next release is meant to reopen it from main.
      - name: Is the open bump someone else's now?
        id: branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          theirs=0
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$url" ]; then
            theirs=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" \
              --jq '[.commits[] | select(.commit.message
                     | startswith("chore(deps): bump go-sdk to ") | not)] | length')
          fi
          echo "theirs=$theirs" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$theirs" -gt 0 ]; then
            echo "::warning::${BRANCH} carries ${theirs} commit(s) this workflow did not write, leaving it alone"
          fi

      # One branch, so there is only ever one open bump: a newer release replaces
      # the pull request rather than adding a second one beside it. The action
      # commits the working tree, so only go.mod and go.sum travel.
      - name: Open or update the pull request
        id: pr
        if: steps.bump.outputs.changed == 'true' && steps.branch.outputs.theirs == '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          base: main
          branch: automation/go-sdk-bump
          delete-branch: true
          reviewers: ${{ env.REVIEWERS }}
          commit-message: "chore(deps): bump go-sdk to ${{ steps.version.outputs.version }}"
          title: "chore(deps): bump go-sdk to ${{ steps.version.outputs.version }}"
          body: |
            `github.com/runpod/go-sdk/v2` moves to [${{ steps.version.outputs.version }}](https://github.com/runpod/go-sdk/releases/tag/${{ steps.version.outputs.version }}).

            Only `v2/go.mod` and `v2/go.sum` are touched. Whether the provider still
            compiles against it is answered by the `test` workflow, started against
            this branch from the Actions tab: a pull request opened by Actions raises
            no checks of its own. A red lane there is a breaking change in the SDK for
            the provider to absorb.

            Opened by the release of runpod/go-sdk. Nothing merges by itself, and a
            commit pushed here stops the next release from replacing this branch.

      # A pull request opened with GITHUB_TOKEN raises no pull_request event, so
      # test.yml never starts on it. Dispatching it against the branch runs the
      # same checks; they land in the Actions tab rather than on the pull request.
      # Not fatal: the pull request is already open by now, and a reviewer who is
      # told to start the checks by hand is better off than one told nothing.
      - name: Start the provider's checks on the branch
        id: checks
        if: steps.pr.outputs.pull-request-url != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref "$BRANCH"

      # The reviewer first, the link second, what to do last. Two outcomes reach
      # here: a bump waiting for review, or a branch left alone because someone
      # is working on it. A run with nothing to bump skips the branch step, so
      # theirs is empty there and must not be read as "someone else's".
      - name: Tell the reviewers
        if: >-
          steps.pr.outputs.pull-request-url != ''
          || (steps.branch.outputs.theirs != '' && steps.branch.outputs.theirs != '0')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SDK_BUMP_SLACK_WEBHOOK_URL }}
          REPO: ${{ github.event.repository.name }}
          URL: ${{ steps.pr.outputs.pull-request-url || steps.branch.outputs.url }}
          VERSION: ${{ steps.version.outputs.version }}
          THEIRS: ${{ steps.branch.outputs.theirs }}
          CHECKS: ${{ steps.checks.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::no SDK_BUMP_SLACK_WEBHOOK_URL secret, nobody was told"
            exit 0
          fi

          # No escaping pass here: every part is ours or a github.com URL, and
          # escaping < and > would turn the mention and the link into text.
          if [ "${THEIRS:-0}" -gt 0 ]; then
            jq -n --arg rev "$SLACK_REVIEWERS" --arg url "$URL" --arg version "$VERSION" \
                  --arg repo "$REPO" --arg n "$THEIRS" '
              {text: ($rev + " " + $repo + ": go-sdk " + $version + " is out, but the open bump carries "
                      + $n + " commit(s) I did not write, so I left the branch alone"
                      + (if $url == "" then "" else "\n" + $url end) + "\n"
                      + "Move the pin there by hand, or close it and the next run will reopen it.")}
            ' > "$RUNNER_TEMP/slack.json"
          else
            # The checks step is allowed to fail, so say which of the two
            # happened rather than promising a run that was never started.
            if [ "${CHECKS:-}" = "success" ]; then
              checks="I started the *test* workflow against the branch; its run is in the Actions tab, not on the pull request."
            else
              checks="I could not start the *test* workflow. Start it by hand: Actions → test → Run workflow on \`${BRANCH}\`."
            fi
            jq -n --arg rev "$SLACK_REVIEWERS" --arg url "$URL" --arg version "$VERSION" \
                  --arg repo "$REPO" --arg checks "$checks" '
              {text: ($rev + " " + $repo + ": the bump to go-sdk " + $version + " is waiting for review"
                      + "\n" + $url + "\n"
                      + "A pull request opened by Actions starts no checks of its own. " + $checks)}
            ' > "$RUNNER_TEMP/slack.json"
          fi

          code=$(printf 'url = %s\n' "$SLACK_WEBHOOK_URL" | curl --silent --show-error \
            --config - --header 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/slack.json" \
            --output "$RUNNER_TEMP/slack-response.txt" --write-out '%{http_code}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Slack answered HTTP ${code}: $(cat "$RUNNER_TEMP/slack-response.txt")"
            exit 1
          fi
